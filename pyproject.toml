[project]
name = "youtube-media-studio"
version = "2.4.1"
description = "AI-powered desktop and command-line toolkit for downloading, tagging, splitting, playing, and organizing media."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mutagen>=1.47.0",
    "numpy>=2.0.0",
    "yt-dlp[default,deno]>=2026.3.17",
    "portable-ffmpeg>=0.2.0",
    "agno>=2.8.7,<3",
    "ollama>=0.6.2,<1",
    "openai>=2.53,<3",
    "ddgs>=9.11,<10",
    "anthropic>=0.75,<1",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.8.0"]

[project.scripts]
youtube-media-studio = "youtube_audio_video_downloader.launcher:main"
yt-audio-downloader = "youtube_audio_video_downloader.cli.audio_downloader_cli:main"
yt-video-downloader = "youtube_audio_video_downloader.cli.video_downloader_cli:main"
yt-album-splitter = "youtube_audio_video_downloader.cli.album_splitter_cli:main"
yt-jukebox-splitter = "youtube_audio_video_downloader.cli.jukebox_splitter_cli:main"
yt-find-duplicate-links = "youtube_audio_video_downloader.cli.duplicate_links_cli:main"
yt-format-artists = "youtube_audio_video_downloader.cli.artist_formatter_cli:main"
yt-parse-tracks = "youtube_audio_video_downloader.cli.track_parser_cli:main"

[project.gui-scripts]
youtube-media-studio-gui = "youtube_audio_video_downloader.launcher:main"
yt-downloader-gui = "youtube_audio_video_downloader.launcher:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "PyQt6>=6.8.0",
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]
package = [
    "PyInstaller>=6.13.0",
    "build>=1.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
default-groups = []

[tool.ruff]
line-length = 100

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
